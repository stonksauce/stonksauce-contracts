[package]
name = "mock-orao"
version = "0.1.0"
description = "Localnet stand-in for ORAO VRF randomness. Never deploy to a public cluster."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_orao"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
