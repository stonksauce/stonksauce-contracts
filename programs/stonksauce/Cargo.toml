[package]
name = "stonksauce"
version = "0.1.0"
description = "Multi-jar weighted daily lottery for StonkFun reward tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stonksauce"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Switchboard devnet program and queue. Mainnet IDs are the default, and
# localnet loads mock_switchboard at the mainnet program address.
devnet = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
bytemuck = { version = "1.21", features = ["derive", "min_const_generics"] }
spl-token-2022 = { version = "7", features = ["no-entrypoint"] }
